<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b1d12">
<meta name="description" content="RechargeKit — every recharge, every validity date, every rupee. Never miss a recharge again.">
<title>RechargeKit — Never Miss a Recharge Again</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf6ef; --paper2:#f3ecdd; --card:#fffdf8; --ink:#2b1d12; --ink2:#5d4a36;
  --mut:#8a7661; --line:#e7dcc8; --amber:#c98a2e; --gold:#d9a441; --terra:#c05b2e;
  --terra-d:#a34a24; --green:#3f7a4e; --red:#b3372a; --blue:#3d6b8e;
  --shadow:0 10px 30px rgba(43,29,18,.10); --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--terra)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);font-weight:800}
.mut{color:var(--mut)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill.ok{background:#e6f0e4;color:#2f6b3c}
.pill.soon{background:#fbeed3;color:#8a5b12}
.pill.bad{background:#f9e2de;color:#a02c20}
.pill.info{background:#e4ecf2;color:#2f5a78}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fdf8ee;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(43,29,18,.25)}
.btn.terra{background:var(--terra)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{padding:44px 0 8px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(24px,3.4vw,32px);font-weight:650;line-height:1.15}
.sec-head p{color:var(--mut);font-size:14px;max-width:520px}
/* ---- intro ---- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241608,#3a2410 55%,#5a2f14);color:#fdf3df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s,visibility .6s;text-align:center;padding:24px}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}
#intro .bars{display:flex;align-items:flex-end;gap:7px;height:64px}
#intro .bars i{width:12px;border-radius:6px;background:linear-gradient(180deg,var(--gold),var(--terra));animation:bar 1.1s ease-in-out infinite}
#intro .bars i:nth-child(1){height:26px;animation-delay:0s}
#intro .bars i:nth-child(2){height:42px;animation-delay:.15s}
#intro .bars i:nth-child(3){height:56px;animation-delay:.3s}
#intro .bars i:nth-child(4){height:64px;animation-delay:.45s}
@keyframes bar{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
#intro h1{font-size:clamp(34px,7vw,58px);font-weight:800;letter-spacing:-.01em}
#intro h1 span{color:var(--gold)}
#intro p{opacity:.85;font-size:15px;max-width:420px}
#intro .prog{width:min(280px,70vw);height:4px;background:rgba(253,243,223,.2);border-radius:99px;overflow:hidden}
#intro .prog i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .2s linear}
#introSkip{position:absolute;bottom:26px;right:26px;color:#fdf3df;border:1px solid rgba(253,243,223,.5);padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700}
/* ---- topbar ---- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(250,246,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:21px}
.logo .sig{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--terra));display:grid;place-items:center}
.logo .sig svg{width:20px;height:20px}
.topnav{margin-left:auto;display:flex;gap:2px}
.topnav a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:99px}
.topnav a:hover{background:var(--paper2);color:var(--ink)}
.streak-chip{margin-left:6px;background:var(--ink);color:#fdf8ee;font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;white-space:nowrap}
@media(max-width:760px){.topnav{display:none}}
/* ---- hero ---- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden}
.hero .photo{position:relative;height:400px}
.hero .photo img{width:100%;height:100%;object-fit:cover;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.08) translateX(-1.2%)}}
.hero .photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,29,18,.05) 40%,rgba(43,29,18,.78))}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:26px 0 30px;color:#fdf8ee}
.hero .copy .wrap{max-width:1080px}
.hero h1{font-size:clamp(30px,5.4vw,52px);line-height:1.05;font-weight:800;max-width:640px}
.hero h1 em{color:var(--gold);font-style:normal}
.hero .sub{margin-top:10px;opacity:.92;max-width:560px;font-size:15px}
.next-card{margin-top:-72px;position:relative;z-index:5}
.next-card .card{padding:22px 24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.next-card .big{font-size:clamp(22px,3.4vw,30px);font-family:Fraunces,serif;font-weight:650;line-height:1.2}
.next-card .big b{color:var(--terra)}
.cd{display:flex;gap:10px}
.cd div{background:var(--paper2);border:1px solid var(--line);border-radius:12px;min-width:64px;padding:10px 8px;text-align:center}
.cd b{display:block;font-size:22px;font-family:Fraunces,serif}
.cd span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:640px){.next-card .card{grid-template-columns:1fr}.cd{justify-content:flex-start}}
/* @@NEXT@@ */
</style>
</head>
<body>
